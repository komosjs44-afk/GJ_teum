<style>
/* Layout: one phone shell centered on the page; a screen picker above it; inside, a scrolling screen and a tab bar */
:root{

  --amber:#f0bd62; --amber-soft:#3a2d14; --amber-line:#c98a2a;
  --warn:#eb9a66; --warn-soft:#3a281d;
  --night:#0b100d; --night-2:#1a2520; --night-ink:#eef3f1; --night-muted:#93a69c; --mint:#5fbf98; --mint-ink:#0b100d;
  --wall:#14211c;
  --c1:#22382d; --c2:#25304a; --c3:#43282f; --c4:#332c47; --c5:#3a3524; --c6:#43301f; --c7:#4a3d14;

}}
:root[data-theme="dark"]{
  --page:#0b100e; --bg:#111815; --surface:#19221e; --surface-2:#202b26; --ink:#e6eee9; --muted:#9eada6; --line:#2c3833;
  --green:#4fb48a; --green-soft:#1b3a2d; --on-green:#0b100e;
  --travel:#e08a50; --prep:#c99a6c; --meal:#d6b04a;
  --amber:#f0bd62; --amber-soft:#3a2d14; --amber-line:#c98a2a;
  --warn:#eb9a66; --warn-soft:#3a281d;

}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:18px 28px}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.top{max-width:420px;margin:0 auto 10px;display:grid;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand small{font-size:12px;color:var(--muted)}
.picker{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.picker button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.picker button.on{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:600}
.reset{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;font-size:12px;cursor:pointer}
.shell{max-width:420px;height:780px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.screen{flex:1;overflow-y:auto;padding:22px 18px 20px;display:flex;flex-direction:column;gap:14px}
.screen.night{background:var(--night);color:var(--night-ink)}
.screen.home{background:var(--wall);color:#fff;padding:26px 18px 18px}
.eyebrow{font-size:13px;color:var(--muted)}
.night .eyebrow{color:var(--night-muted)}
h1{font-size:27px;line-height:1.2;margin:2px 0 0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:16px;margin:0;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sub{font-size:13px;color:var(--muted)}
.night .sub{color:var(--night-muted)}
.num{font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer;background:var(--green);color:var(--on-green);font-size:15px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%;padding:14px}
.night .btn{background:var(--mint);color:var(--mint-ink)}
.sheet label.btn{display:block;color:var(--on-green);font-size:15px;font-weight:600;text-align:center;cursor:pointer}
.setlist{background:var(--surface);border-radius:16px;overflow:hidden}
.setrow{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 14px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;font-size:15px}
.setrow:last-child{border-bottom:0}

.setrow .tx{flex:1;min-width:0}

.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.link{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:4px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:8px;border-radius:9px;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600}
.sum{background:var(--night);color:var(--night-ink);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-end}

.delta{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--green-soft);color:var(--green);margin-left:6px;vertical-align:middle}
.delta.minus{background:var(--amber-soft);color:var(--amber)}
.sum .delta{background:var(--mint);color:var(--mint-ink)}
.sum .delta.minus{background:var(--amber-line);color:#2a1a00}
.banner{background:var(--night);color:var(--night-ink);border-radius:12px;padding:10px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner button{border:0;background:none;color:var(--mint);font-weight:700;cursor:pointer;padding:6px 0;font-size:13px;white-space:nowrap}
.tl{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:start}
.time{font-size:13px;color:var(--muted);padding-top:12px}
.card{background:var(--surface);border-radius:14px;padding:12px 14px;min-width:0}
.card h3{margin:0;font-size:16px;font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.late{background:var(--amber-soft);color:var(--amber)}
.tag.dark{background:var(--night);color:var(--night-ink)}
.tag.gray{background:var(--surface-2);color:var(--muted)}
.shiftrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.shiftrow button{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 9px;font-size:13px;cursor:pointer}
.shiftrow button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.gap{border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:11px 14px;text-align:left;cursor:pointer;width:100%;min-width:0;font-size:inherit}
.gap.live{border-color:var(--green);background:var(--green-soft)}
.gap.changed{border-style:solid;border-width:2px}
.gap .ttl{font-weight:700;color:var(--green)}
.gap.zero .ttl{color:var(--muted)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);margin:8px 0 6px}
.bar span{display:block;height:100%}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend{display:grid;gap:7px;font-size:14px}
.hero{font-size:52px;font-weight:700;color:var(--green);line-height:1;letter-spacing:-.02em}
.strike{color:var(--muted);text-decoration:line-through;font-size:17px;margin-left:8px}
.task{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;border:1.5px solid transparent;min-width:0}
.task.first{border-color:var(--green)}
.task.doing{border:2px solid var(--amber-line)}
.task.done{opacity:.78}
.task.done .name{text-decoration:line-through;color:var(--muted)}
.task .body{flex:1;min-width:0}
.task .name{font-weight:600}
.rank{width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.rank.top{background:var(--night);color:var(--night-ink)}
.status{border:0;border-radius:99px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.status.todo{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.status.doing{background:var(--amber-soft);color:var(--amber)}
.status.done{background:var(--green-soft);color:var(--green)}
.status i{width:8px;height:8px;border-radius:50%;display:inline-block}
.status.todo i{border:1.5px solid currentColor}
.status.doing i{background:var(--amber-line)}
.status.done i{background:currentColor}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.warn{color:var(--warn)}
.okc{color:var(--green)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.sheet label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.sheet input,.sheet select{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px 8px}
.tab{border:0;background:none;font-size:12px;color:var(--muted);padding:6px 0;cursor:pointer;display:grid;justify-items:center;gap:2px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--green);font-weight:700}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--night);color:var(--night-ink);padding:10px 16px;border-radius:12px;font-size:14px;width:max-content;max-width:calc(100% - 32px);z-index:5;box-shadow:0 6px 20px rgb(0 0 0 / .25)}
/* home */
.widget{background:var(--surface);color:var(--ink);border-radius:26px;padding:18px;display:grid;gap:12px}
.widget.dark{background:var(--night);color:var(--night-ink);border:2px solid var(--mint)}
.widget.dark.minus{border-color:var(--amber-line)}
.widget.ask{border:2px solid var(--amber-line)}
.wbig{font-size:42px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--mint)}
.widget.minus .wbig{color:#f3c27a}
.wrec{background:var(--night-2);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.wbtns{display:flex;gap:8px;flex-wrap:wrap}
.wbtns .btn{flex:1}
.optbtn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 6px;font-size:14px;font-weight:600;cursor:pointer;min-width:0}
.optbtn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.optbtn.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.preview{background:var(--green-soft);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.preview.minus{background:var(--amber-soft)}
.apps{display:grid;grid-template-columns:repeat(4,1fr);row-gap:18px;justify-items:center}
.app{display:grid;justify-items:center;gap:6px;font-size:12px;color:#e4ece8}
.app i{width:58px;height:58px;border-radius:16px;display:block}
.dock{margin-top:auto;background:rgb(255 255 255 / .14);border-radius:28px;padding:12px;display:grid;grid-template-columns:repeat(4,1fr);justify-items:center}
.dock i,.dock button{width:58px;height:58px;border-radius:16px;display:block;border:0;padding:0}
.dock button{background:#1a6b50;cursor:pointer;display:grid;place-items:center}
.demo{border:1px dashed rgb(255 255 255 / .35);border-radius:12px;padding:10px 12px;font-size:12px;color:#d6e2dc;display:flex;justify-content:space-between;align-items:center;gap:10px}
.demo button{border:1px solid rgb(255 255 255 / .4);background:transparent;color:#fff;border-radius:9px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
/* week */
.week{background:var(--surface);border-radius:16px;overflow:hidden}
.whead,.wbody{display:grid;grid-template-columns:26px repeat(5,minmax(0,1fr))}
.whead div{font-size:12px;text-align:center;padding:6px 0;color:var(--muted)}
.whead .today{background:var(--green);color:var(--on-green);font-weight:700}
.wcol{position:relative;border-left:1px solid var(--line)}
.wtime{position:relative}
.wtime span{position:absolute;right:3px;font-size:10px;color:var(--muted);transform:translateY(-6px)}
.wline{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.wev{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 4px;font-size:10px;line-height:1.25;overflow:hidden;color:var(--ink)}
.wev b{font-weight:700;display:block}
.wgap{position:absolute;left:2px;right:2px;border-radius:6px;border:1.5px dashed var(--green);display:grid;place-items:center;text-align:center;font-size:10px;color:var(--green);background:var(--green-soft);cursor:pointer;padding:0;line-height:1.2}
.wgap.zero{border-color:var(--line);color:var(--muted);background:transparent}
/* night */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps i{height:4px;border-radius:9px;background:var(--night-2)}
.steps i.done{background:var(--mint)}
.ncard{background:var(--night-2);border-radius:14px;padding:12px 14px;min-width:0}
.ngap{border:1.5px dashed var(--mint);border-radius:14px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.ngap.empty{border-color:var(--night-muted)}
.ntask{background:var(--night-ink);color:var(--night);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.night .time{color:var(--night-muted)}
/* alerts */
.alert{background:var(--surface);border-radius:14px;padding:12px 14px;border:1.5px solid transparent}
.alert.hl{border-color:var(--green)}
.alert.dark{background:var(--night);color:var(--night-ink)}
.alert .k{font-size:12px;font-weight:700}
.check{display:flex;justify-content:space-between;align-items:center;background:var(--surface);padding:13px 14px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.check:first-child{border-radius:14px 14px 0 0}.check:last-child{border-radius:0 0 14px 14px;border-bottom:0}
.check input{width:20px;height:20px;accent-color:var(--green)}
/* recap & story */
.ring{position:relative;width:110px;height:110px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--night-2);border-radius:14px;padding:12px 8px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--night-muted)}
.mini{height:8px;border-radius:4px;background:var(--night-2);overflow:hidden;display:flex}
.mini span{background:var(--mint)}
.story{background:#1a6b50;color:#fff;border-radius:22px;aspect-ratio:9/16;max-width:100%;padding:26px 22px;display:flex;flex-direction:column}
.story .pct{font-size:110px;font-weight:700;line-height:.9;letter-spacing:-.04em}
.story .pct small{font-size:52px}
.sbar{display:flex;height:30px;gap:3px;margin-top:6px}
.sbar span{border-radius:6px}
.sstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:20px}
.sstats div{background:rgb(15 63 48 / .6);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;color:#bdebd8}
.sstats b{display:block;font-size:20px;color:#fff}
@media (prefers-reduced-motion:no-preference){.btn,.gap,.status,.optbtn{transition:transform .12s}.btn:active,.gap:active,.status:active,.optbtn:active{transform:scale(.97)}}
@media (max-width:440px){body{padding-inline:8px}.shell{height:calc(100dvh - 120px);min-height:620px;border-radius:24px}}
</style>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = m => String(Math.floor((m % 1440 + 1440) % 1440 / 60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
const dur = m => m <= 0 ? '0분' : (m >= 60 ? Math.floor(m/60) + '시간' + (m%60 ? ' ' + (m%60) + '분' : '') : m + '분');
const dueTxt = d => d === 0 ? '오늘 23:59' : 'D-' + d;

const TRAVEL = {'제1공학관 204|학교 앞 스터디카페':25,'학교 앞 스터디카페|인문관 310':20,'인문관 310|알바 장소':40,'알바 장소|학생회관':20};
/* 예시 학교: 실제 앱에서는 학교 지도 데이터로 건물 위치를 가져와요. 좌표 단위는 m */
const SCHOOLS = {
  hanbit: {name:'한빛대학교', campus:'본캠퍼스', note:'평지 · 건물이 가까이 모여 있어요', slope:1,

function gapsOf(list, useBase) {
  const ev = [...list].map(e => useBase ? {...e, end:e.base} : e).sort((a, b) => a.start - b.start);
  const out = [];
  for (let i = 0; i < ev.length - 1; i++) {

    const prep = Math.min(b.prep || 0, raw - travel);
    const meal = Math.min(mealTime(a.end, raw), raw - travel - prep);
    out.push({from:a, to:b, start:a.end, end:b.start, raw, travel, prep, meal, usable:Math.max(0, raw - travel - prep - meal), mode:ti.mode, meters:ti.meters});

}

function vWeek(m, seg) {

    <div class="banner"><span>오늘 틈 ${m.gaps.filter(g => g.usable > 0).length}개 · 실제 ${dur(m.usable)}${m.diff ? ' (' + (m.diff>0?'+':'−') + dur(Math.abs(m.diff)) + ')' : ''}</span><span style="color:var(--night-muted)">점선 = 틈</span></div>

    body = `<div class="sheet">
      <b>에타 시간표 불러오기</b>
      <div class="sub">에브리타임 시간표 화면을 캡처해서 올리면, 요일·시간·과목·강의실을 읽어서 주간 시간표를 채워요.</div>
      <label class="btn block" for="ttFile">캡처 이미지 올리기</label>
      <input id="ttFile" type="file" accept="image/*" hidden>
      <button class="btn ghost block" data-act="ttSample">예시 이미지로 해보기</button>
      <div class="sub">이미지는 시간표를 읽는 데만 쓰고 저장하지 않아요.</div>
    </div>`;
  } else if (t.stage === 'reading') {
    body = `<div class="sheet">${ttThumb()}<b>시간표를 읽고 있어요…</b><div class="sub">요일 칸 → 시간 줄 → 과목과 강의실 순서로 읽어요.</div><div class="bar"><span style="width:65%;background:var(--green)"></span></div></div>`;
  } else {
    const rows = t.rows.map((r, i) => `<div class="card" style="display:grid;gap:6px;${r.flag?'border:1.5px solid var(--amber-line)':''}">
      <div class="row"><b>${esc(r.n)}</b><button class="link" data-act="ttDel" data-i="${i}" aria-label="${esc(r.n)} 빼기">빼기</button></div>
      <div class="sub num">${DAYS[r.d]}요일 ${hm(r.s)} – ${hm(r.e)}</div>
      ${r.flag ? `<label class="sub" for="ttPlace${i}" style="display:grid;gap:4px;color:var(--amber);font-weight:600">강의실 글씨가 흐려서 못 읽었어요. 직접 적어 주세요<input id="ttPlace${i}" data-tt="${i}" value="${esc(r.l)}" placeholder="예: 경상관 402" style="font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)"></label>` : `<div class="sub">${esc(r.l)}</div>`}
    </div>`).join('');
    const need = t.rows.filter(r => r.flag && !r.l.trim()).length;
    body = `${ttThumb()}
      <div><h2>수업 ${t.rows.length}개를 찾았어요</h2><div class="sub">맞는지 확인하고 넣어 주세요. 알바·동아리처럼 에타에 없는 일정은 직접 추가해요.</div></div>
      <div style="display:grid;gap:8px">${rows}</div>
      <div class="row"><button class="btn ghost" data-act="ttAgain">다시 올리기</button><button class="btn" data-act="ttApply" style="flex:1">${need ? '확인 필요 ' + need + '개 남음 · 그래도 넣기' : '시간표에 넣기'}</button></div>`;
  }
  return `${setHead('시간표', true)}
    ${body}
    <h2>지금 시간표</h2>
    <div class="card row"><div><b>${S.timetable ? '수업 ' + S.timetable.length + '개' : '아직 없음'}</b><div class="sub">${S.timetable ? '에타 캡처에서 불러옴' : '캡처를 올리면 여기에 표시돼요'}</div></div>${S.timetable ? '<button class="btn small ghost" data-act="ttClear">비우기</button>' : ''}</div>`;
}

/* ---------- gap ---------- */
function vGap(m) {
  const g = m.gaps.find(x => x.from.id === S.gapFrom) || m.gaps[0];
  const rows = m.active.map((t, i) => `<div class="task ${i===0 && g.usable>0?'first':''} ${t.status==='doing'?'doing':''}"><span class="rank ${i===0?'top':''}">${i+1}</span>
      <div class="body"><div class="name">${esc(t.name)}</div><div class="sub ${t.due===0?'warn':''}">마감 ${dueTxt(t.due)}</div></div>
      ${t.status === 'doing' ? '<span class="tag late">진행 중</span>' : i === 0 && g.usable > 0 ? `<button class="btn small" data-act="start" data-id="${t.id}">지금 시작</button>` : `<button class="btn small ghost" data-act="start" data-id="${t.id}">시작</button>`}</div>`).join('');
  return `<div class="row" style="justify-content:flex-start"><button class="link" data-act="go" data-v="today" style="font-size:22px;text-decoration:none;color:var(--ink);padding:0 6px 0 0" aria-label="오늘 일정으로">‹</button><b class="num">${hm(g.start)} – ${hm(g.end)} 사이의 틈</b></div>
    <div class="eyebrow">${esc(g.from.name)} 끝 → ${esc(g.to.name)} 시작 전</div>
    <div><span class="hero num">${dur(g.usable)}</span><span class="strike num">${dur(g.raw)}</span>${deltaTag(g.diff)}</div>
    <div class="sub">${g.usable > 0 ? '애매해 보여도, 실제로 쓸 수 있는 시간이에요.' : '이 틈은 이동과 식사로 다 채워져요.'}</div>
    <div class="card">${segBar(g)}<div class="legend">
      ${g.travel ? `<div class="row"><span style="min-width:0"><i class="dot" style="background:var(--travel)"></i>이동 (${esc(g.from.loc)} → ${esc(g.to.loc)})<br><span class="sub">${g.mode === 'walk' ? '캠퍼스 안 도보' + (g.meters ? ' · 약 ' + g.meters + 'm' : '') : g.mode === 'guess' ? '위치를 몰라 기본 15분으로 계산' : '캠퍼스 밖 · 대중교통 기준'}</span></span><b class="num">${g.travel}분</b></div>` : ''}
      ${g.meal ? `<div class="row"><span><i class="dot" style="background:var(--meal)"></i>식사</span><b class="num">${g.meal}분</b></div>` : ''}
      ${g.prep ? `<div class="row"><span><i class="dot" style="background:var(--prep)"></i>준비 시간</span><b class="num">${g.prep}분</b></div>` : ''}
      <div class="row"><span><i class="dot" style="background:var(--green)"></i>쓸 수 있는 시간</span><b class="num okc">${dur(g.usable)}</b></div></div></div>
    <div><h2>이 틈에 할 일 · 마감 가까운 순</h2><div class="sub">다 못 끝내도 괜찮아요. 멈춘 일은 '진행 중'으로 남아 다음 틈에 이어서 해요.</div></div>
    <div style="display:grid;gap:10px">${rows || '<div class="sub">남은 할 일이 없어요.</div>'}</div>
    ${g.usable > 0 && m.active.length ? `<button class="btn block" data-act="start" data-id="${m.active[0].id}">1순위부터 시작하기</button>` : ''}`;
}

/* ---------- tasks ---------- */
const ST = {todo:'시작 전', doing:'진행 중', done:'완료'};
function taskCard(t, m, extra) {
  const rank = m.active.indexOf(t) + 1;
  const gid = m.place[t.id], g = gid && m.gaps.find(x => x.from.id === gid);
  let where = '';
  if (t.moved) where = `<div class="sub" style="color:var(--amber);font-weight:600">내일 틈으로 옮김</div>`;
  else if (t.status === 'done') where = '<div class="sub">끝냄</div>';
  else if (t.status === 'doing') where = '<div class="sub" style="color:var(--amber);font-weight:600">하는 중 · 멈춰도 다음 틈에 이어서</div>';
  else if (g) where = `<div class="sub okc"><b>→ ${hm(g.start)} 틈 추천</b></div>`;
  else where = `<div class="sub warn"><b>오늘 틈에 못 들어감 · 앞 순위가 먼저예요</b></div>`;
  return `<div class="task ${t.status}"><span class="rank ${rank===1?'top':''}">${t.status==='done'?'✓':t.moved?'→':rank}</span>
    <div class="body"><div class="name">${esc(t.name)}</div><div class="sub ${t.due<=1&&t.status!=='done'?'warn':''}">마감 ${dueTxt(t.due)}</div>${where}${extra || ''}</div>
    <button class="status ${t.status}" data-act="cycle" data-id="${t.id}" aria-label="상태: ${ST[t.status]}, 눌러서 바꾸기"><i></i>${ST[t.status]}</button></div>`;
}
function vTasks(m) {
  const today = S.tasks.filter(t => !t.moved && (t.status !== 'todo' || m.place[t.id]));
  const out = m.active.filter(t => t.status !== 'doing' && !m.place[t.id]);
  const moved = byDue(S.tasks.filter(t => t.moved));
  const done = S.tasks.filter(t => !t.moved && t.status === 'done');
  const liveN = m.gaps.filter(g => g.usable > 0).length;
  const dueOpts = [[0,'오늘'],[1,'내일 (D-1)'],[2,'D-2'],[3,'D-3'],[5,'D-5'],[7,'D-7'],[10,'D-10'],[14,'D-14']].map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  const head = `<div class="row"><div><div class="eyebrow">전체 과제 ${S.tasks.length}개 · 마감 가까운 순 · 칩을 누르면 상태가 바뀌어요</div><h1>할 일</h1></div><button class="btn small" data-act="addOpen" aria-expanded="${S.addOpen}">+ 추가</button></div>
    ${S.addOpen ? `<form class="sheet" id="tkForm"><b>할 일 추가</b><label for="tkName">할 일<input id="tkName" required placeholder="예: 통계학 퀴즈 공부"></label><label for="tkDue">마감<select id="tkDue">${dueOpts}</select></label><div class="row"><button type="button" class="btn ghost small" data-act="addOpen">닫기</button><button class="btn small">추가하고 순서 다시 정하기</button></div></form>` : ''}
`;

  {
    const inGap = byDue(m.active.filter(t => t.status === 'doing' || m.place[t.id]));
    const group = (title, sub, items, extraFn, action) => items.length ? `<div style="display:grid;gap:8px"><div class="row"><div><h2>${title} <span class="sub num">${items.length}</span></h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${action || ''}</div>${items.map(t => taskCard(t, m, extraFn ? extraFn(t) : '')).join('')}</div>` : '';
    return `${head}
      <div class="card" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center">
        <div><b class="num okc" style="font-size:20px">${inGap.length}</b><div class="sub">오늘 틈</div></div>
        <div><b class="num warn" style="font-size:20px">${out.length}</b><div class="sub">틈 밖</div></div>
        <div><b class="num" style="font-size:20px;color:var(--amber)">${moved.length}</b><div class="sub">내일로</div></div>
        <div><b class="num" style="font-size:20px">${done.length}</b><div class="sub">완료</div></div>
      </div>
      ${group('오늘 틈에 들어감', `오늘 쓸 수 있는 틈 ${liveN}개 · ${dur(m.usable)}`, inGap)}
      ${group('틈 밖 · 아직 남은 과제', '오늘 틈은 마감이 더 가까운 일이 먼저 써요', out, t => `<div style="margin-top:8px"><button class="btn small ghost" data-act="move" data-id="${t.id}">내일 틈에 넣기</button></div>`, out.length > 1 ? '<button class="btn small" data-act="moveAll">모두 내일 틈에</button>' : '')}
      ${group('내일 틈으로 옮김', '', moved, t => `<button class="link" data-act="unmove" data-id="${t.id}">오늘로 되돌리기</button>`)}
      ${group('완료', '', done)}`;
  }

}

/* ---------- plan ---------- */
function vPlan(m) {
  const evs = [...S.tomorrow].sort((a, b) => a.start - b.start), moved = byDue(S.tasks.filter(t => t.moved));
  let rows = '';
  evs.forEach((e, i) => {
    rows += `<div class="time num">${hm(e.start)}</div><div class="ncard"><b>${esc(e.name)}</b><div class="sub">${esc(e.kind)} · ~${hm(e.end)}</div></div>`;
    const g = m.tgaps.find(x => x.from.id === e.id);
    if (g) rows += `<div class="time num" style="color:var(--mint)">${hm(g.start)}</div><div class="ngap"><div class="row"><b style="color:var(--mint)">틈 · 실제 ${dur(g.usable)}</b><span class="sub">빈 시간 ${dur(g.raw)}</span></div><div class="sub">${cutText(g)} 제외</div>
      ${moved.map(t => `<div class="ntask"><div><b>${esc(t.name)}</b><div style="font-size:12px">오늘에서 옮김 · 마감 ${dueTxt(Math.max(0, t.due - 1))}</div></div><b style="color:var(--amber);font-size:12px;white-space:nowrap">이어서 하기</b></div>`).join('') || '<div class="sub">아직 넣은 할 일이 없어요. 할 일 탭에서 "내일 틈에 넣기"를 눌러 보세요.</div>'}</div>`;
    if (i === evs.length - 1) rows += `<div class="time num">${hm(e.end)}</div><div class="ngap empty"><div class="row"><span>틈 · 비워 둠</span><span class="sub">휴식</span></div></div>`;
  });
  return `<div><div class="eyebrow">오늘 밤 21:30 · 5분이면 끝나요</div><h1>내일 계획하기</h1><div class="eyebrow">10월 10일 토요일</div></div>
    <div class="steps" aria-hidden="true"><i class="done"></i><i class="done"></i><i></i></div>
    <div class="sub">1 일정 확인 · <b style="color:var(--night-ink)">2 할 일 배치</b> · 3 알림 설정</div>
    <div class="tl">${rows}</div>
    <div class="ncard"><b>남은 할 일 중 마감이 가까운 것</b><div class="sub">${esc(S.upcoming[0].name)} · D-${S.upcoming[0].due - 1} → 일요일 틈에 시작 제안</div></div>
    <button class="btn block" data-act="go" data-v="alerts">다음: 알림 설정</button>`;
}

/* ---------- alerts ---------- */
function vAlerts(m) {
  const list = [], dueToday = S.tasks.filter(t => !t.moved && t.due === 0 && t.status !== 'done');
  list.push({t:480, k:'오늘 요약', msg:`오늘 쓸 수 있는 시간은 ${dur(m.usable)}, 오늘 마감인 할 일은 ${dueToday.length}개예요.`});
  if (S.notif.gap) m.gaps.filter(g => g.usable > 0).forEach(g => {
    const rec = m.active.find(t => m.place[t.id] === g.from.id);
    list.push({t:g.start - 10, k:'틈 시작 전', hl:true, msg:`10분 뒤 ${dur(g.usable)}짜리 틈이 생겨요.` + (rec ? ` 마감이 가까운 ${rec.name}부터 시작해 볼까요?` : '')});
  });
  if (S.notif.depart) m.gaps.filter(g => g.travel > 0).forEach(g => list.push({t:g.end - g.travel, k:'출발 알림', warn:true, msg:`지금 출발해야 ${hm(g.end)} ${g.to.name}에 늦지 않아요. 이동 ${g.travel}분.`}));
  if (S.notif.due && dueToday[0]) list.push({t:1200, k:'마감 알림', warn:true, msg:`${dueToday[0].name} 마감까지 4시간 남았어요.`});
  if (S.notif.plan) list.push({t:S.sleep.bed - 60, k:'내일 계획', dark:true, msg:`내일 일정 ${S.tomorrow.length}개, 틈 ${m.tgaps.length}개. 5분만 계획해 볼까요?`});
  list.sort((a, b) => a.t - b.t);
  const opt = (id, label) => `<label class="check" for="n_${id}"><span>${label}</span><input type="checkbox" id="n_${id}" data-act="notif" data-k="${id}" ${S.notif[id]?'checked':''}></label>`;
  return `<div><div class="eyebrow">오늘 받을 알림 ${list.length}개 · 틈이 바뀌면 시간도 같이 바뀌어요</div><h1>알림</h1></div>
    <div style="display:grid;gap:10px">${list.map(a => `<div class="alert ${a.hl?'hl':''} ${a.dark?'dark':''}"><div class="row"><span class="k ${a.hl?'okc':''} ${a.warn?'warn':''}">${a.k}</span><span class="k num ${a.hl?'okc':''} ${a.warn?'warn':''}">${hm(a.t)}</span></div><div style="font-weight:600">${esc(a.msg)}</div></div>`).join('')}</div>
    <h2>알림 설정</h2>
    <div>${opt('gap','틈 시작 10분 전')}${opt('depart','이동 시간을 고려한 출발 알림')}${opt('due','마감 알림')}${opt('plan','전날 계획 알림 · 21:30')}</div>`;
}

/* ---------- recap & story ---------- */
function stats(m) {
  const live = m.gaps.filter(g => g.usable > 0);
  const filled = live.filter(g => S.used[g.from.id]).reduce((s, g) => s + g.usable, 0);
  const rate = m.usable ? Math.round(filled / m.usable * 100) : 0;
  return {live, filled, rate, done: S.tasks.filter(t => t.status === 'done').length, doing: S.tasks.filter(t => t.status === 'doing').length};
}
function vRecap(m) {
  const s = stats(m), C = 2 * Math.PI * 46;
  return `<div class="row"><span class="eyebrow">10월 9일 금요일 · 23:00</span><button class="link" data-act="go" data-v="today" style="color:var(--night-muted)">닫기</button></div>
    <div><h1>오늘의 틈 리포트</h1><div class="sub">시작한 틈과 끝낸 일을 모아 봤어요. 다른 화면에서 바꾸면 여기 숫자도 바뀌어요.</div></div>
    <div class="ncard row" style="justify-content:flex-start;gap:18px;padding:18px">
      <div class="ring"><svg width="110" height="110" viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="46" fill="none" stroke="var(--night)" stroke-width="12"/><circle cx="55" cy="55" r="46" fill="none" stroke="var(--mint)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C * s.rate / 100} ${C}" transform="rotate(-90 55 55)"/></svg><b class="num">${s.rate}%</b></div>
      <div><div class="sub">쓸 수 있던 시간 ${dur(m.usable)} 중</div><div class="num" style="font-size:24px;font-weight:700;color:var(--mint);line-height:1.2">${dur(s.filled)}</div><div>틈을 채웠어요</div></div></div>
    <div class="stats"><div><b class="num">${s.done}개</b><span>끝낸 할 일</span></div><div><b class="num">${s.doing}개</b><span>이어서 할 일</span></div><div><b class="num">${s.live.length}개</b><span>오늘 틈</span></div></div>
    <h2>틈별 기록</h2>
    <div style="display:grid;gap:10px">${m.gaps.map(g => `<div><div class="row" style="font-size:13px"><span class="num">${hm(g.start)} 틈 · ${g.usable ? (S.used[g.from.id] ? '사용함' : '비어 있음') : '이동·식사'}</span><b class="num" style="color:${S.used[g.from.id]?'var(--mint)':'var(--night-muted)'}">${dur(S.used[g.from.id] ? g.usable : 0)} / ${dur(g.usable)}</b></div><div class="mini"><span style="width:${g.usable && S.used[g.from.id] ? 100 : 0}%"></span></div></div>`).join('')}</div>
    <button class="btn block" data-act="go" data-v="story">인스타 스토리 카드 만들기</button>
    <div class="sub" style="text-align:center">과목 이름은 빼고, 숫자만 담아요</div>`;
}
function vStory(m) {
  const s = stats(m), tot = 1290 - 540;
  const segs = [];
  [...S.events].sort((a, b) => a.start - b.start).forEach(e => {
    segs.push(`<span style="flex:${e.end - e.start};background:#0f3f30"></span>`);
    const g = m.gaps.find(x => x.from.id === e.id);
    if (g && g.raw) segs.push(`<span style="flex:${g.raw};background:${S.used[g.from.id] ? '#ffffff' : 'rgb(255 255 255 / .25)'}"></span>`);
  });
  return `<div class="row"><button class="link" data-act="go" data-v="recap" style="font-size:22px;text-decoration:none;color:var(--ink);padding:0">‹</button><b>스토리 카드 미리보기</b><span></span></div>
    <div class="story">
      <div class="row"><b>10.09 FRI</b><span style="color:#bdebd8;font-size:13px">오늘의 틈</span></div>
      <div style="margin-top:auto;color:#d7f2e6;font-size:17px;font-weight:600">흘려보낼 뻔한 틈을</div>
      <div class="pct num">${s.rate}<small>%</small></div>
      <div style="font-size:21px;font-weight:700">채워 쓴 하루</div>
      <div class="sbar" aria-hidden="true">${segs.join('')}</div>
      <div class="row" style="font-size:11px;color:#d7f2e6;margin-top:6px"><span>■ 정해진 일정 · □ 채운 틈</span><span>9시 → 21시</span></div>
      <div class="sstats"><div><b class="num">${dur(s.filled)}</b>찾은 시간</div><div><b class="num">${s.done}개</b>끝낸 할 일</div><div><b class="num">5일</b>연속 계획</div></div>

function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
async function drawStory() {
